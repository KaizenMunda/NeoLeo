[build]
  command = "npm run build"
  publish = "dist"

# Old multi-page URLs now land on the office.
[[redirects]]
  from = "/spa.html"
  to = "/"
  status = 301

# Ayu legal pages — clean URLs for App Store / Play Console
[[redirects]]
  from = "/legal/ayu/privacy"
  to = "/legal/ayu/privacy/"
  status = 301

[[redirects]]
  from = "/legal/ayu/terms"
  to = "/legal/ayu/terms/"
  status = 301

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/office/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

