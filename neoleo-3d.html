<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeoLeo — 3D intro scaffold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<style>
  :root{
    --ink:#0A0A0B; --cobalt:#2540E8; --plasma:#FF6B00;
    --ki:#46E6FF; --lemon:#FFD400; --paper:#FFFFFF;
    --display:"Bricolage Grotesque","Archivo Black",sans-serif;
    --body:"Space Grotesk",Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);font-family:var(--body);overflow:hidden}

  /* The B&W state is a filter on the whole stage — the WebGL canvas is a
     DOM child, so the lion desaturates with everything else. No post-processing. */
  #stage{position:relative;width:100%;height:100vh;overflow:hidden;background:var(--ink);
         filter:grayscale(1) contrast(1.15) brightness(.92)}
  #stage.lit{filter:none}
  #stage.swapping{transition:filter 180ms linear}
  #stage.shake{animation:shake 420ms cubic-bezier(.36,.07,.19,.97) both}
  @keyframes shake{
    10%,90%{transform:translate(-3px,1px)} 20%,80%{transform:translate(6px,-2px)}
    30%,50%,70%{transform:translate(-10px,3px)} 40%,60%{transform:translate(10px,-3px)}
    100%{transform:none}
  }

  header{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;
         align-items:flex-start;justify-content:space-between;padding:34px 40px}
  #logo{font-family:var(--display);font-size:clamp(30px,4.4vw,58px);line-height:.86;
        letter-spacing:-.045em;color:var(--paper);text-transform:uppercase}
  #stage.lit #logo .leo{color:var(--lemon)}
  #logo .tag{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.34em;
             color:#8b8b93;margin-top:10px;text-transform:uppercase}
  #stage.lit #logo .tag{color:var(--ki)}
  nav{display:flex;gap:30px;padding-top:8px}
  nav a{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
        color:#9a9aa2;text-decoration:none;padding-bottom:4px;border-bottom:1px solid transparent}
  nav a:hover,nav a:focus-visible{color:var(--paper);border-bottom-color:var(--plasma)}
  #stage.lit nav a{color:var(--paper)}

  .hero{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;
        justify-content:center;padding:0 40px;pointer-events:none}
  .hero h1{font-family:var(--display);font-size:clamp(38px,8.2vw,124px);line-height:.84;
           letter-spacing:-.05em;text-transform:uppercase;color:var(--paper);max-width:14ch}
  .sub{font-size:clamp(14px,1.4vw,18px);color:#a4a4ad;max-width:44ch;margin-top:26px;line-height:1.5}
  #stage.lit .sub{color:#dfe3ff}

  .colourfield{position:absolute;inset:0;z-index:1;opacity:0;
    background:radial-gradient(120% 90% at 12% 8%,#3a5bff 0%,transparent 58%),
               radial-gradient(90% 80% at 92% 96%,#ff4d00 0%,transparent 60%),
               linear-gradient(160deg,var(--cobalt) 0%,#1226a8 62%,#0b1240 100%)}
  .stripe{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;height:74px;
          opacity:0;border-top:2px solid var(--ink)}
  .stripe div{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--mono);
              font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);
              border-right:2px solid var(--ink)}
  .stripe div:last-child{border-right:0}
  .s1{background:var(--lemon)}.s2{background:var(--ki)}.s3{background:var(--plasma)}.s4{background:var(--paper)}
  .colourfield,.stripe{transition:opacity 900ms ease}
  #stage.lit .colourfield,#stage.lit .stripe{opacity:1}

  /* WebGL layer: transparent, sits between page content and the FX canvas */
  #three{position:absolute;inset:0;z-index:7;pointer-events:none}
  #fx{position:absolute;inset:0;z-index:20;pointer-events:none}

  .controls{position:absolute;right:26px;bottom:22px;z-index:30;display:flex;gap:10px}
  .controls button{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    padding:9px 16px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);
    color:#fff;cursor:pointer;backdrop-filter:blur(6px)}
  .controls button:hover{border-color:var(--plasma);color:var(--plasma)}
  #stage.lit .controls{bottom:96px}

  #status{position:absolute;left:40px;bottom:22px;z-index:30;font-family:var(--mono);
          font-size:10px;letter-spacing:.14em;color:#6b6b74;text-transform:uppercase}
  #stage.lit #status{bottom:96px}

  /* ---- tuner (press D) ---- */
  #tuner{position:fixed;top:0;right:0;z-index:100;width:288px;height:100vh;overflow:auto;
    background:#111114;border-left:1px solid #26262c;padding:18px;color:#d6d6de;
    font-family:var(--mono);font-size:11px;display:none}
  #tuner.open{display:block}
  #tuner h3{font-size:10px;letter-spacing:.24em;color:#7d7d88;margin:16px 0 8px;font-weight:500}
  #tuner h3:first-child{margin-top:0}
  #tuner label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
  #tuner input[type=range]{flex:1;accent-color:var(--plasma)}
  #tuner .val{width:52px;text-align:right;color:#fff}
  #tuner button{width:100%;margin-top:14px;padding:9px;background:var(--plasma);border:0;
    color:#0A0A0B;font-family:var(--mono);font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;cursor:pointer}
  #tuner pre{margin-top:12px;padding:10px;background:#0A0A0B;border:1px solid #26262c;
    font-size:10px;color:#8de3ff;white-space:pre-wrap;word-break:break-all}

  @media (max-width:720px){
    header{padding:22px 20px;flex-direction:column;gap:18px}
    nav{gap:18px;flex-wrap:wrap}
    .hero{padding:34vh 20px 0;justify-content:flex-start}
    .stripe{height:56px}.stripe div{font-size:8px;letter-spacing:.12em}
    #status{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    #three,#fx{display:none}
    #stage{filter:none}
    .colourfield,.stripe{opacity:1}
  }
</style>

<div id="stage">
  <div class="colourfield"></div>

  <header>
    <div id="logo">Neo<span class="leo">Leo</span><span class="tag">Technologies · New Delhi</span></div>
    <nav><a href="#">Work</a><a href="#">Studio</a><a href="#">Lab</a><a href="#">Contact</a></nav>
  </header>

  <div class="hero">
    <h1 id="headline">Software that hits harder than its headcount.</h1>
    <p class="sub" id="subline">We design, build and ship products for teams who'd rather move than deliberate.</p>
  </div>

  <div class="stripe">
    <div class="s1">Product</div><div class="s2">Engineering</div>
    <div class="s3">3D &amp; Motion</div><div class="s4">Data</div>
  </div>

  <canvas id="three"></canvas>
  <canvas id="fx"></canvas>

  <div id="status">Loading Leo…</div>
  <div class="controls">
    <button id="skip" type="button">Skip</button>
    <button id="replay" type="button" hidden>Replay</button>
  </div>
</div>

<div id="tuner">
  <h3>Model</h3>
  <label>Height <input id="t_h" type="range" min="1" max="8" step=".05" value="3.6"><span class="val" id="v_h"></span></label>
  <label>X <input id="t_x" type="range" min="-4" max="4" step=".02" value="0"><span class="val" id="v_x"></span></label>
  <label>Y <input id="t_y" type="range" min="-4" max="4" step=".02" value="0"><span class="val" id="v_y"></span></label>
  <label>Z <input id="t_z" type="range" min="-6" max="3" step=".05" value="0"><span class="val" id="v_z"></span></label>
  <label>Yaw <input id="t_ry" type="range" min="-180" max="180" step="1" value="0"><span class="val" id="v_ry"></span></label>
  <label>Pitch <input id="t_rx" type="range" min="-60" max="60" step="1" value="0"><span class="val" id="v_rx"></span></label>
  <label>Roll <input id="t_rz" type="range" min="-60" max="60" step="1" value="0"><span class="val" id="v_rz"></span></label>

  <h3>Muzzle locator</h3>
  <label>X <input id="t_mx" type="range" min="-3" max="3" step=".01" value="-.7"><span class="val" id="v_mx"></span></label>
  <label>Y <input id="t_my" type="range" min="-2" max="4" step=".01" value="1.5"><span class="val" id="v_my"></span></label>
  <label>Z <input id="t_mz" type="range" min="-3" max="3" step=".01" value=".4"><span class="val" id="v_mz"></span></label>

  <h3>Light</h3>
  <label>Key <input id="t_key" type="range" min="0" max="4" step=".05" value="1.4"><span class="val" id="v_key"></span></label>
  <label>Fill <input id="t_amb" type="range" min="0" max="4" step=".05" value="1.1"><span class="val" id="v_amb"></span></label>

  <button id="copyCfg" type="button">Copy config</button>
  <pre id="cfgOut"></pre>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader }    from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

/* ============================================================
   1. CONFIG — point this at your Meshy export and tune with D
   ============================================================ */
const MODEL_URL = './leo.glb';

const cfg = {
  height: 3.6,                 // world height the model is normalised to
  pos:  { x: 0, y: 0, z: 0 },  // offset from the bottom-right screen anchor
  rot:  { x: 0, y: 0, z: 0 },  // degrees
  muzzle: { x: -0.7, y: 1.5, z: 0.4 }, // local-space point the beam fires from
  key: 1.4, amb: 1.1,
  anchorNX: 0.52,              // horizontal anchor in NDC (-1 left, 1 right)
};

/* ============================================================
   2. SCENE
   ============================================================ */
const stage  = document.getElementById('stage');
const glCan  = document.getElementById('three');
const fxCan  = document.getElementById('fx');
const ctx    = fxCan.getContext('2d');
const logoEl = document.getElementById('logo');
const statusEl = document.getElementById('status');
const headline = document.getElementById('headline');
const subline  = document.getElementById('subline');
const skipBtn  = document.getElementById('skip');
const replayBtn= document.getElementById('replay');

const renderer = new THREE.WebGLRenderer({ canvas: glCan, alpha: true, antialias: true });
renderer.setClearAlpha(0);
renderer.toneMapping = THREE.NoToneMapping;   // cartoon: keep colours punchy

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 0, 8);

const rig = new THREE.Group();          // handles the entrance / recoil animation
const holder = new THREE.Group();       // handles the tuner transform
rig.add(holder);
scene.add(rig);

const muzzle = new THREE.Object3D();
holder.add(muzzle);
const muzzleDot = new THREE.Mesh(
  new THREE.SphereGeometry(0.07, 12, 12),
  new THREE.MeshBasicMaterial({ color: 0xff3b3b })
);
muzzleDot.visible = false;
muzzle.add(muzzleDot);

const key  = new THREE.DirectionalLight(0xffffff, cfg.key);
key.position.set(-3, 4, 5);
const rim  = new THREE.DirectionalLight(0x9fd0ff, 0.8);
rim.position.set(4, 1, -3);
const amb  = new THREE.HemisphereLight(0xffffff, 0x404058, cfg.amb);
scene.add(key, rim, amb);

/* ---- loaders: cover draco / meshopt / ktx2 so any optimise flag works ---- */
const draco = new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
const ktx2  = new KTX2Loader().setTranscoderPath('https://unpkg.com/three@0.169.0/examples/jsm/libs/basis/').detectSupport(renderer);
const loader = new GLTFLoader()
  .setDRACOLoader(draco)
  .setKTX2Loader(ktx2)
  .setMeshoptDecoder(MeshoptDecoder);

let model = null, modelH = 1;

function fitModel(obj){
  // Meshy exports arrive at arbitrary scale with an arbitrary origin.
  // Normalise: centre on X/Z, sit the feet on y=0, scale to cfg.height.
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const ctr  = box.getCenter(new THREE.Vector3());
  const s = cfg.height / (size.y || 1);
  obj.scale.setScalar(s);
  obj.position.set(-ctr.x * s, -box.min.y * s, -ctr.z * s);
  modelH = cfg.height;
}

function fallbackLion(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18),
    new THREE.MeshStandardMaterial({ color: 0xE8A020, roughness: .7 }));
  body.position.y = 1.1; body.scale.set(1, 1.15, 1);
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(.16, .2, 2.4, 16),
    new THREE.MeshStandardMaterial({ color: 0x4A4A52, roughness: .5, metalness: .4 }));
  tube.rotation.z = Math.PI / 2 - 0.45; tube.position.set(-.2, 1.7, .35);
  g.add(body, tube);
  return g;
}

loader.load(MODEL_URL,
  (gltf) => {
    model = gltf.scene;
    model.traverse(o => { if (o.isMesh){ o.frustumCulled = false; o.material.side = THREE.FrontSide; } });
    fitModel(model);
    holder.add(model);
    statusEl.textContent = 'Leo loaded · press D to tune';
    play();
  },
  (e) => { if (e.total) statusEl.textContent = `Loading Leo… ${Math.round(e.loaded / e.total * 100)}%`; },
  () => {
    model = fallbackLion();
    fitModel(model);
    holder.add(model);
    statusEl.textContent = 'leo.glb not found — using stand-in · press D';
    play();
  }
);

/* ============================================================
   3. LAYOUT — anchor the model to a screen position, not a world one
   ============================================================ */
let W = 0, H = 0;

function worldAtNDC(nx, ny, zPlane = 0){
  const v = new THREE.Vector3(nx, ny, 0.5).unproject(camera);
  const dir = v.sub(camera.position).normalize();
  const dist = (zPlane - camera.position.z) / dir.z;
  return camera.position.clone().add(dir.multiplyScalar(dist));
}

function place(){
  const p = worldAtNDC(cfg.anchorNX, -1, 0);
  holder.position.set(p.x + cfg.pos.x, p.y + cfg.pos.y, cfg.pos.z);
  holder.rotation.set(
    THREE.MathUtils.degToRad(cfg.rot.x),
    THREE.MathUtils.degToRad(cfg.rot.y),
    THREE.MathUtils.degToRad(cfg.rot.z)
  );
  muzzle.position.set(cfg.muzzle.x, cfg.muzzle.y, cfg.muzzle.z);
}

function resize(){
  W = stage.clientWidth; H = stage.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  // widen the framing on portrait so Leo still fits
  camera.fov = W / H < 0.9 ? 46 : 35;
  camera.updateProjectionMatrix();
  fxCan.width = W * dpr; fxCan.height = H * dpr;
  fxCan.style.width = W + 'px'; fxCan.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  place();
}
resize();
window.addEventListener('resize', resize);

/* project the muzzle's world position into CSS pixels — this is what
   lets a 2D beam layer stay welded to a 3D barrel */
const _v = new THREE.Vector3();
function muzzleScreen(){
  muzzle.getWorldPosition(_v).project(camera);
  return { x: (_v.x * 0.5 + 0.5) * W, y: (-_v.y * 0.5 + 0.5) * H };
}
function elementCentre(el){
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2 };
}

/* ============================================================
   4. TIMELINE + FX
   ============================================================ */
const T = { lionIn: 500, charge: 1150, fire: 2500, travel: 380 };
T.impact = T.fire + T.travel;
T.swap   = T.impact + 110;
T.end    = T.impact + 3600;

let start = 0, raf = 0, running = false;
let embers = [], smoke = [], shock = null, flash = 0;
let origin = { x: 0, y: 0 }, target = { x: 0, y: 0 };
const rnd = (a, b) => a + Math.random() * (b - a);
const easeOutBack = t => 1 + 2.2 * Math.pow(t - 1, 3) + 1.4 * Math.pow(t - 1, 2);

function detonate(){
  embers = []; smoke = []; flash = 1; shock = { r: 0, a: 1 };
  for (let i = 0; i < 150; i++){
    const a = rnd(0, Math.PI * 2), s = rnd(3, 20);
    embers.push({ x: target.x, y: target.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rnd(.5, 1), decay: rnd(.006, .018), size: rnd(1.5, 5.5),
      hue: ['#FFF6C9','#FFD400','#FF6B00','#46E6FF'][(Math.random() * 4) | 0] });
  }
  for (let i = 0, n = Math.round(Math.max(W, H) / 12); i < n; i++){
    const a = rnd(0, Math.PI * 2), s = rnd(1.5, 9);
    smoke.push({ x: target.x + rnd(-40, 40), y: target.y + rnd(-40, 40),
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - rnd(.2, 1.1),
      r: rnd(50, 190), grow: rnd(.4, 1.6), a: rnd(.5, .95),
      fade: rnd(.0025, .006), tint: Math.random() < .22 });
  }
  stage.classList.add('shake');
  setTimeout(() => stage.classList.remove('shake'), 440);
}

function animateLion(t){
  if (!model) return;
  // entrance: rise from below the frame with an overshoot
  let p = Math.min(Math.max((t - T.lionIn) / 620, 0), 1);
  const rise = (1 - easeOutBack(p)) * -(modelH * 1.25);
  // brace during charge
  const c = Math.min(Math.max((t - T.charge) / 900, 0), 1);
  const brace = Math.sin(c * Math.PI) * 0.05;
  // recoil on fire
  const k = Math.min(Math.max((t - T.fire) / 320, 0), 1);
  const kick = k > 0 && k < 1 ? Math.sin(k * Math.PI) : 0;
  rig.position.set(kick * 0.35, rise - kick * 0.12, kick * 0.5);
  rig.rotation.z = brace + kick * 0.10;
  rig.rotation.x = -kick * 0.06;
}

function drawBeam(t){
  if (t < T.fire) return;
  const p = Math.min((t - T.fire) / T.travel, 1);
  const sustain = t - T.impact;
  let alpha = sustain > 420 ? Math.max(0, 1 - (sustain - 420) / 260) : 1;
  if (alpha <= 0) return;
  const hx = origin.x + (target.x - origin.x) * p;
  const hy = origin.y + (target.y - origin.y) * p;
  const wob = Math.sin(t / 22) * 2.5;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = alpha; ctx.lineCap = 'round';
  [[46,'rgba(37,64,232,.30)'],[26,'rgba(70,230,255,.55)'],[12,'rgba(180,245,255,.9)'],[5,'#ffffff']]
    .forEach(([w, c]) => { ctx.strokeStyle = c; ctx.lineWidth = w + wob;
      ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(hx, hy); ctx.stroke(); });
  const rr = 34 + Math.sin(t / 30) * 5;
  const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, rr);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(.35, 'rgba(70,230,255,.85)');
  g.addColorStop(1, 'rgba(37,64,232,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, rr, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function frame(now){
  if (!start) start = now;
  const t = now - start;

  animateLion(t);
  renderer.render(scene, camera);

  ctx.clearRect(0, 0, W, H);
  origin = muzzleScreen();
  target = elementCentre(logoEl);
  drawBeam(t);

  if (shock){
    shock.r += 26; shock.a -= .035;
    if (shock.a <= 0) shock = null;
    else { ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(255,214,0,${shock.a})`; ctx.lineWidth = 10 * shock.a + 2;
      ctx.beginPath(); ctx.arc(target.x, target.y, shock.r, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
  }

  for (const s of smoke){
    s.x += s.vx; s.y += s.vy; s.vx *= .96; s.vy = s.vy * .96 - .045;
    s.r += s.grow; s.a -= s.fade;
    if (s.a <= 0) continue;
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
    const base = s.tint ? '90,102,140' : '150,150,158';
    g.addColorStop(0, `rgba(${base},${s.a * .55})`);
    g.addColorStop(.55, `rgba(${base},${s.a * .26})`);
    g.addColorStop(1, `rgba(${base},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  smoke = smoke.filter(s => s.a > 0);

  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const e of embers){
    e.x += e.vx; e.y += e.vy; e.vx *= .965; e.vy = e.vy * .965 + .16; e.life -= e.decay;
    if (e.life <= 0) continue;
    ctx.globalAlpha = Math.max(0, e.life); ctx.fillStyle = e.hue;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.size * e.life, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  embers = embers.filter(e => e.life > 0);

  if (flash > 0){
    ctx.save(); ctx.fillStyle = `rgba(255,255,255,${Math.min(1, flash)})`;
    ctx.fillRect(0, 0, W, H); ctx.restore(); flash -= .05;
  }

  if (t >= T.end && running){ finish(); return; }
  raf = requestAnimationFrame(frame);
}

const COPY = {
  before: ['Software that hits harder than its headcount.',
           "We design, build and ship products for teams who'd rather move than deliberate."],
  after:  ['We build things that go off.',
           'Product, engineering, 3D and data — one team, from sketch to shipped.']
};

let timers = [];
function schedule(){
  timers.forEach(clearTimeout);
  timers = [
    setTimeout(detonate, T.impact),
    setTimeout(() => {
      stage.classList.add('swapping', 'lit');
      headline.textContent = COPY.after[0];
      subline.textContent  = COPY.after[1];
    }, T.swap)
  ];
}

function finish(){
  running = false;
  ctx.clearRect(0, 0, W, H);
  stage.classList.add('lit');
  headline.textContent = COPY.after[0];
  subline.textContent  = COPY.after[1];
  rig.position.set(0, 0, 0); rig.rotation.set(0, 0, 0);
  skipBtn.hidden = true; replayBtn.hidden = false;
  raf = requestAnimationFrame(idle);   // keep rendering for tuning
}
function idle(){ renderer.render(scene, camera); raf = requestAnimationFrame(idle); }

function play(){
  cancelAnimationFrame(raf);
  running = true;
  skipBtn.hidden = false; replayBtn.hidden = true;
  stage.classList.remove('lit', 'swapping');
  headline.textContent = COPY.before[0];
  subline.textContent  = COPY.before[1];
  embers = []; smoke = []; shock = null; flash = 0; start = 0;
  schedule();
  raf = requestAnimationFrame(frame);
}

skipBtn.addEventListener('click', () => { timers.forEach(clearTimeout); finish(); });
replayBtn.addEventListener('click', play);

if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  stage.classList.add('lit');
}

   5. TUNER — press D
   ============================================================ */
const tuner = document.getElementById('tuner');
addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'd' && !/input|textarea/i.test(e.target.tagName)){
    tuner.classList.toggle('open');
    muzzleDot.visible = tuner.classList.contains('open');
  }
});

const binds = [
  ['t_h','v_h',  v => { cfg.height = v; if (model) fitModel(model); }],
  ['t_x','v_x',  v => cfg.pos.x = v],  ['t_y','v_y', v => cfg.pos.y = v],
  ['t_z','v_z',  v => cfg.pos.z = v],
  ['t_ry','v_ry',v => cfg.rot.y = v],  ['t_rx','v_rx',v => cfg.rot.x = v],
  ['t_rz','v_rz',v => cfg.rot.z = v],
  ['t_mx','v_mx',v => cfg.muzzle.x = v], ['t_my','v_my',v => cfg.muzzle.y = v],
  ['t_mz','v_mz',v => cfg.muzzle.z = v],
  ['t_key','v_key', v => { cfg.key = v; key.intensity = v; }],
  ['t_amb','v_amb', v => { cfg.amb = v; amb.intensity = v; }],
];
binds.forEach(([id, out, set]) => {
  const el = document.getElementById(id), lbl = document.getElementById(out);
  const apply = () => { const v = parseFloat(el.value); set(v); lbl.textContent = v.toFixed(2); place(); dump(); };
  el.addEventListener('input', apply); apply();
});
function dump(){
  document.getElementById('cfgOut').textContent = JSON.stringify({
    height: cfg.height, pos: cfg.pos, rot: cfg.rot, muzzle: cfg.muzzle,
    key: cfg.key, amb: cfg.amb
  }, null, 1);
}
document.getElementById('copyCfg').addEventListener('click', () => {
  navigator.clipboard?.writeText(document.getElementById('cfgOut').textContent);
});
</script>
